# Local development only (avoids clashing with other local Supabase projects)
[api]
port = 54421

[db]
port = 54422
shadow_port = 54420
major_version = 17

[studio]
port = 54423

[inbucket]
port = 54424

[analytics]
port = 54427

[db.pooler]
port = 54429

[functions.grocery-ai]
enabled = true
verify_jwt = true
import_map = "./functions/grocery-ai/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/grocery-ai/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/grocery-ai/*.html" ]

[functions.create-checkout]
enabled = true
verify_jwt = true
import_map = "./functions/create-checkout/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/create-checkout/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/create-checkout/*.html" ]

[functions.text-to-contract]
enabled = true
verify_jwt = false
entrypoint = "./functions/text-to-contract/index.ts"
